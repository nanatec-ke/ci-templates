# Reusable deploy workflow — build on the shared runner, ship over SSH, run with PM2.
#
# The runner that executes this is NOT the target server: it builds the app,
# then rsyncs the release to the app's own host and reloads PM2 there. One
# template serves every repo (single app or monorepo); the PM2 ecosystem file
# in each repo decides how many processes run and on which ports.
#
# Release layout created on each server (Capistrano-style, atomic + rollbackable):
#
#   <deploy_path>/
#   ├── shared/.env            # runtime secrets, owned by the server, never shipped
#   ├── releases/<sha>/        # one dir per deploy; current points at the live one
#   └── current -> releases/<sha>
#
# PM2 is always started from <deploy_path>/current/ecosystem.config.cjs, so a
# rollback is just re-pointing `current` and reloading (see README).

name: deploy-pm2

on:
  workflow_call:
    inputs:
      app_name:
        description: "Logical app name (used for the release dir and PM2 namespace)."
        required: true
        type: string
      environment:
        description: "GitHub Environment to deploy to (production | staging). Gates secrets + approvals."
        required: true
        type: string
      deploy_path:
        description: "Base directory on the target server, e.g. /opt/azil/frontend/AZIL-FRONTEND."
        required: true
        type: string
      package_manager:
        description: "bun | npm — selects install/build defaults and the server-side prod install."
        required: false
        type: string
        default: bun
      build_command:
        description: "Override the build command. Defaults to '<pm> run build'."
        required: false
        type: string
        default: ""
      node_version:
        description: "Node version for the runtime (PM2 runs node on the server; build also needs it for npm projects)."
        required: false
        type: string
        default: "22"
      bun_version:
        description: "Bun version when package_manager=bun. 1.3.11+ avoids the react-dom/server.bun.js SSR build bug in 1.2.x."
        required: false
        type: string
        default: "1.3.11"
      runs_on:
        description: 'JSON array of runner labels, e.g. ["self-hosted","linux"].'
        required: false
        type: string
        default: '["self-hosted","linux"]'
      dotenv_source:
        description: "Where the BUILD-time .env comes from: server (scp from <deploy_path>/shared/.env) | secret (BUILD_DOTENV) | none."
        required: false
        type: string
        default: server
      keep_releases:
        description: "How many old releases to retain on the server for rollback."
        required: false
        type: number
        default: 5
      health_url:
        description: "Optional URL curled after reload; a non-2xx fails the deploy."
        required: false
        type: string
        default: ""
      auth_method:
        description: "SSH auth to the target: key (DEPLOY_SSH_KEY) | password (DEPLOY_PASSWORD, via sshpass). Prefer key."
        required: false
        type: string
        default: key
    secrets:
      DEPLOY_SSH_KEY:
        description: "Private key authorised on the server. Required when auth_method=key."
        required: false
      DEPLOY_PASSWORD:
        description: "SSH password for DEPLOY_USER. Required when auth_method=password (needs sshpass on the runner)."
        required: false
      DEPLOY_KNOWN_HOSTS:
        description: "Pinned host keys (output of ssh-keyscan on the server). Always required."
        required: true
      DEPLOY_HOST:
        description: "Target server hostname/IP for this environment."
        required: true
      DEPLOY_USER:
        description: "SSH user that owns the deploy_path and the PM2 daemon."
        required: true
      BUILD_DOTENV:
        description: "Full .env contents, used only when dotenv_source=secret."
        required: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: ${{ inputs.environment }}
    # Never let two deploys of the same app+environment race on the server.
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      PM: ${{ inputs.package_manager }}
      APP: ${{ inputs.app_name }}
      BASE: ${{ inputs.deploy_path }}
      SHA: ${{ github.sha }}
      KEEP: ${{ inputs.keep_releases }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # Consumed by `sshpass -e` when auth_method=password; empty (and unused)
      # for key auth. Passed via env so it is never on a command line or in logs.
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      # Node is always set up, even for Bun projects: Astro builds run under
      # Node (node node_modules/.bin/astro build) to avoid Bun's react-dom
      # server.bun.js SSR crash. npm cache only applies to npm projects.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager == 'npm' && 'npm' || '' }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          AUTH: ${{ inputs.auth_method }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          KH="$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$KH"
          # Host-key pinning applies to both auth methods.
          BASE_OPTS="-o UserKnownHostsFile=$KH -o StrictHostKeyChecking=yes"
          # Build the ssh/scp/rsync-shell commands once and hand them to later
          # steps via $GITHUB_ENV (shell vars don't persist across steps).
          if [ "$AUTH" = "password" ]; then
            command -v sshpass >/dev/null 2>&1 || {
              echo "::error::auth_method=password requires sshpass on the runner (e.g. 'sudo apt-get install -y sshpass')."; exit 1; }
            [ -n "${SSHPASS:-}" ] || { echo "::error::auth_method=password but DEPLOY_PASSWORD secret is empty."; exit 1; }
            # Force password auth so ssh doesn't silently fall through to a key.
            PW_OPTS="$BASE_OPTS -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
            printf 'SSH_CMD=sshpass -e ssh %s\n'  "$PW_OPTS" >> "$GITHUB_ENV"
            printf 'SCP_CMD=sshpass -e scp %s\n'  "$PW_OPTS" >> "$GITHUB_ENV"
            printf 'RSH_CMD=sshpass -e ssh %s\n'  "$PW_OPTS" >> "$GITHUB_ENV"
          else
            [ -n "$SSH_KEY" ] || { echo "::error::auth_method=key but DEPLOY_SSH_KEY secret is empty."; exit 1; }
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"; chmod 600 "$RUNNER_TEMP/ssh/key"
            KEY_OPTS="-i $RUNNER_TEMP/ssh/key $BASE_OPTS -o BatchMode=yes"
            printf 'SSH_CMD=ssh %s\n' "$KEY_OPTS" >> "$GITHUB_ENV"
            printf 'SCP_CMD=scp %s\n' "$KEY_OPTS" >> "$GITHUB_ENV"
            printf 'RSH_CMD=ssh %s\n' "$KEY_OPTS" >> "$GITHUB_ENV"
          fi

      - name: Fetch build-time .env
        env:
          BUILD_DOTENV: ${{ secrets.BUILD_DOTENV }}
        run: |
          set -euo pipefail
          case "${{ inputs.dotenv_source }}" in
            server)
              # The server is the single source of truth for env. Astro inlines
              # every PUBLIC_* at BUILD time, so we need it here, not just at runtime.
              # $SCP_CMD is ssh-key or sshpass+password depending on auth_method.
              $SCP_CMD "$DEPLOY_USER@$DEPLOY_HOST:$BASE/shared/.env" ./.env ;;
            secret)
              printf '%s\n' "$BUILD_DOTENV" > ./.env ;;
            none)
              echo "No .env fetched (dotenv_source=none)." ;;
            *)
              echo "::error::Unknown dotenv_source '${{ inputs.dotenv_source }}'"; exit 1 ;;
          esac

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ "$PM" = "bun" ]; then bun install --frozen-lockfile; else npm ci; fi

      - name: Build
        run: |
          set -euo pipefail
          CMD="${{ inputs.build_command }}"
          if [ -z "$CMD" ]; then CMD="$PM run build"; fi
          NODE_ENV=production $CMD

      - name: Ship release and reload PM2
        run: |
          set -euo pipefail
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          REL="$BASE/releases/$SHA"
          # $SSH_CMD / $RSH_CMD were set by "Configure SSH" (key or password auth).

          # 1. Make sure the release layout exists.
          $SSH_CMD "$TARGET" "mkdir -p '$BASE/releases' '$BASE/shared' '$REL/logs'"

          # 2. Sync the built tree into the new release. Exclude heavy/local-only
          #    dirs and never clobber the server-owned runtime .env.
          rsync -az --delete \
            -e "$RSH_CMD" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.turbo' \
            --exclude '.env' \
            ./ "$TARGET:$REL/"

          # 3. Finalize on the server: prod deps, flip `current`, reload PM2, prune.
          $SSH_CMD "$TARGET" "PM='$PM' BASE='$BASE' SHA='$SHA' KEEP='$KEEP' bash -s" <<'REMOTE'
          set -euo pipefail
          export PM2_HOME="${PM2_HOME:-$HOME/.pm2}"
          # A non-interactive SSH session does not source ~/.bashrc, so
          # user-installed toolchains (bun, nvm-managed node, pm2) are not on
          # PATH. Make them resolvable here. System installs and /usr/local/bin
          # symlinks are already covered by the inherited PATH.
          export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
          PATH="/usr/local/bin:$BUN_INSTALL/bin:$HOME/.local/bin:$PATH"
          # nvm-managed node/pm2 (newest installed version wins); best effort.
          if [ -d "$HOME/.nvm/versions/node" ]; then
            for d in "$HOME"/.nvm/versions/node/*/bin; do [ -d "$d" ] && PATH="$d:$PATH"; done
          fi
          export PATH
          REL="$BASE/releases/$SHA"
          cd "$REL"
          if [ "$PM" = "bun" ]; then
            bun install --frozen-lockfile --production
          else
            npm ci --omit=dev
          fi
          # Link the shared runtime env and logs into the release.
          [ -f "$BASE/shared/.env" ] && ln -sfn "$BASE/shared/.env" "$REL/.env"
          # Atomically promote this release.
          ln -sfn "$REL" "$BASE/current"
          cd "$BASE/current"
          # Delete and re-start only THIS ecosystem's apps (scoped by the names
          # in the file — never other projects on the shared daemon) so PM2
          # adopts the new release's script paths. A plain reload keeps the path
          # the process was first started with and would serve stale code; these
          # apps run in fork mode, so reload isn't zero-downtime anyway.
          pm2 delete ecosystem.config.cjs >/dev/null 2>&1 || true
          pm2 start ecosystem.config.cjs --env production
          pm2 save
          # Keep the newest $KEEP releases, drop the rest (|| true so an empty
          # glob never trips pipefail).
          { ls -1dt "$BASE"/releases/*/ 2>/dev/null || true; } | tail -n +$((KEEP+1)) | xargs -r rm -rf
          echo "Deployed $SHA -> $(readlink -f "$BASE/current")"
          REMOTE

      - name: Health check
        if: inputs.health_url != ''
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 --max-time 15 "${{ inputs.health_url }}" > /dev/null
          echo "Health check passed: ${{ inputs.health_url }}"

      - name: Remove SSH key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
